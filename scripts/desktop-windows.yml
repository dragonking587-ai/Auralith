name: Auralith Desktop Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-desktop*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend
        run: npm ci
      - name: Build desktop UI
        run: npm run desktop:build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0-desktop-test.1' }}
          releaseName: Auralith Desktop Test 1
          releaseBody: |
            Auralith standalone Windows test build (`1.0.0-desktop-test.1`).

            After install, Auralith runs locally. It does not need Netlify, the website, or an internet connection for core use.

            **System audio:** WASAPI loopback of the selected Windows output device (YouTube / Chrome / Spotify / games).

            **Browser Source (OBS / Streamlabs):** `http://127.0.0.1:4317/source/<session>` (port may fall through to 4327). Bound to localhost only.

            **Window Capture:** capture **Auralith — Stream Output**.

            This installer is **unsigned**. Windows SmartScreen may warn until a code-signing certificate is added. Do not bypass SmartScreen guidance — choose More info → Run anyway only if you trust this build.

            Automatic signed updates are not enabled in this test (no certificate).
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false
