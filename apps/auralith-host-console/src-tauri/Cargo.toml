[package]
name = "auralith-host-console"
version = "1.0.0-rc.33"
description = "Auralith Host Console"
authors = ["Auralith"]
edition = "2021"

[lib]
name = "auralith_host_console_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
