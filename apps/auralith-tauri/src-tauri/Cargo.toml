[package]
name = "auralith-tauri-preview"
version = "1.0.0-rc.38"
description = "Auralith Tauri Preview"
authors = ["Auralith"]
edition = "2021"

[lib]
name = "auralith_tauri_preview_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
