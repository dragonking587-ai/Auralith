[[permission]]
identifier = "allow-vcam-status"
description = "Query virtual camera status"
commands.allow = ["vcam_status"]

[[permission]]
identifier = "allow-vcam-install"
description = "Register the virtual camera DLL"
commands.allow = ["vcam_install"]

[[permission]]
identifier = "allow-vcam-start"
description = "Start virtual camera publisher"
commands.allow = ["vcam_start"]

[[permission]]
identifier = "allow-vcam-stop"
description = "Stop virtual camera publisher"
commands.allow = ["vcam_stop"]

[[permission]]
identifier = "allow-vcam-push-frame"
description = "Push a clean frame into shared memory"
commands.allow = ["vcam_push_frame"]

[[permission]]
identifier = "allow-poll-server-status"
description = "Query poll viewer server status"
commands.allow = ["poll_server_status"]

[[permission]]
identifier = "allow-poll-server-start"
description = "Start poll viewer HTTP server"
commands.allow = ["poll_server_start"]

[[permission]]
identifier = "allow-poll-server-set-hub"
description = "Update poll viewer public state"
commands.allow = ["poll_server_set_hub"]

[[permission]]
identifier = "allow-poll-open-local"
description = "Start viewer server and open local poll page"
commands.allow = ["poll_open_local"]

[[permission]]
identifier = "allow-poll-detach-host"
description = "Open detached host poll control window"
commands.allow = ["poll_detach_host"]
