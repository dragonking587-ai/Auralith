# Netlify production config for Auralith (dev branch).
# Nitro emits static files to dist/ and the SSR/API server to
# .netlify/functions-internal (auto-deployed; do not set a custom
# Functions directory in the Netlify UI).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"
