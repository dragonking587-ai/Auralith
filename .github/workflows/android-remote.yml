name: Build Auralith Remote Android
on:
  workflow_dispatch:
  push:
    branches: [tauri/auralith-reborn]
    paths:
      - "apps/auralith-remote-android/**"
      - ".github/workflows/android-remote.yml"
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/auralith-remote-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p dist-apk
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" dist-apk/Auralith-Remote-1.0.0-remote.5-debug.apk
          cp "$APK" dist-apk/Auralith-Remote-debug.apk
          sha256sum dist-apk/Auralith-Remote-1.0.0-remote.5-debug.apk | tee dist-apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Auralith-Remote-debug
          path: apps/auralith-remote-android/dist-apk/*
