name: Auralith UI Navigation Cleanup

on:
  push:
    branches:
      - tauri/auralith-reborn
    paths:
      - ".github/workflows/ui-navigation-cleanup.yml"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri/auralith-reborn
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Make rc49 hotfix package-version aware
        run: node apps/auralith-tauri/scripts/fix-rc49-package-version-source.mjs
      - name: Apply navigation cleanup
        run: node apps/auralith-tauri/scripts/apply-ui-navigation-cleanup.mjs
      - name: Keep CI workflow unchanged in app commit
        run: git checkout -- .github/workflows/tauri-preview.yml
      - name: Commit candidate cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/auralith-tauri/src/ui/App.tsx apps/auralith-tauri/src/ui/styles.css apps/auralith-tauri/vite.config.ts apps/auralith-tauri/scripts/verify-rc49-ui-lock.mjs apps/auralith-tauri/scripts/apply-rc49-hotfix.mjs
          git commit -m "feat(reborn): clean navigation home and quality controls"
      - name: Install frontend
        working-directory: apps/auralith-tauri
        run: npm install
      - name: Audit UI and quality
        working-directory: apps/auralith-tauri
        run: |
          node scripts/verify-ui-navigation.mjs
          node scripts/verify-quality-system.mjs
      - name: Build frontend
        working-directory: apps/auralith-tauri
        run: npm run build
      - name: Re-run audits after build transforms
        working-directory: apps/auralith-tauri
        run: |
          node scripts/verify-ui-navigation.mjs
          node scripts/verify-quality-system.mjs
      - name: Push validated cleanup
        run: git push origin HEAD:tauri/auralith-reborn
