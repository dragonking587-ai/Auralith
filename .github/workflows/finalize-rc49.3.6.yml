name: Finalize Auralith Reborn RC49.3.6 Metadata

on:
  push:
    branches: [tauri/auralith-reborn]
    paths:
      - ".github/workflows/finalize-rc49.3.6.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri/auralith-reborn
      - name: Correct release title and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v1.0.0-rc.49.3.6"
          gh release edit "$tag" \
            --repo dragonking587-ai/Auralith \
            --title "Auralith Reborn 1.0.0-rc.49.3.6 — Home, Navigation & Quality Cleanup" \
            --notes-file apps/auralith-tauri/RELEASE_NOTES.md

          mkdir -p /tmp/auralith-release
          gh release download "$tag" --repo dragonking587-ai/Auralith --pattern latest.json --dir /tmp/auralith-release
          node <<'NODE'
          const fs = require('fs');
          const p = '/tmp/auralith-release/latest.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (j.version !== '1.0.0-rc.49.3.6') throw new Error(`unexpected updater version ${j.version}`);
          const url = String(j.platforms?.['windows-x86_64']?.url || '');
          const sig = String(j.platforms?.['windows-x86_64']?.signature || '');
          if (!url.includes('/v1.0.0-rc.49.3.6/') || /Host-Console|Host\.Console/i.test(url)) throw new Error(`unexpected updater URL ${url}`);
          if (!sig) throw new Error('missing updater signature');
          j.notes = 'Auralith Reborn 1.0.0-rc.49.3.6 — Home, Navigation & Quality Cleanup';
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          NODE
          gh release upload "$tag" /tmp/auralith-release/latest.json --repo dragonking587-ai/Auralith --clobber
          gh release upload updater-latest /tmp/auralith-release/latest.json --repo dragonking587-ai/Auralith --clobber
          echo "RC49.3.6 release metadata finalized."
