name: Build Auralith Host Console

on:
  workflow_dispatch:
  push:
    branches: [tauri/auralith-reborn]
    paths:
      - "apps/auralith-host-console/**"
      - "apps/auralith-tauri/VERSION"
      - "apps/auralith-tauri/src-tauri/tauri.conf.json"
      - ".github/workflows/host-console.yml"
      - ".github/workflows/tauri-preview.yml"
  workflow_run:
    workflows: ["Auralith Reborn Preview"]
    types: [completed]
    branches: [tauri/auralith-reborn]

jobs:
  windows:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/auralith-host-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: npm install --include=dev --registry https://registry.npmjs.org
      - name: Tauri NSIS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis
      - name: Collect installer
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $src = Get-ChildItem -Recurse "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $src) { throw "No NSIS exe" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $friendly = "Auralith-Host-Console-$ver-x64-Setup.exe"
          Copy-Item $src.FullName "dist/$friendly"
          Copy-Item $src.FullName "dist/$($src.Name)"
          $sig = Get-ChildItem -Recurse src-tauri/target/release/bundle -Include *.sig | Select-Object -First 1
          $zip = Get-ChildItem -Recurse src-tauri/target/release/bundle -Include *.nsis.zip,*.zip | Where-Object { $_.Name -match "nsis|updater" } | Select-Object -First 1
          if ($sig) { Copy-Item $sig.FullName "dist/$($sig.Name)" }
          if ($zip) { Copy-Item $zip.FullName "dist/$($zip.Name)" }
          $sigText = if ($sig) { (Get-Content $sig.FullName -Raw).Trim() } else { "" }
          $signedName = if ($zip) { $zip.Name } else { $src.Name }
          $enc = [uri]::EscapeDataString($signedName)
          $url = "https://github.com/dragonking587-ai/Auralith/releases/download/v$ver/$enc"
          if ($url -match "Auralith-Reborn") { throw "Host Console manifest must not point at Reborn" }
          @{
            version = $ver
            notes = "Auralith Host Console $ver"
            pub_date = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigText
                url = $url
              }
            }
          } | ConvertTo-Json -Depth 6 | Set-Content dist/latest-host-console.json -Encoding utf8
          if (-not $sigText) { Write-Warning "No Host Console updater signature produced" }
          Get-FileHash "dist/$friendly" -Algorithm SHA256 | Out-File "dist/SHA256.txt"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: Auralith-Host-Console-nsis
          path: apps/auralith-host-console/dist/*
      - name: Attach Host Console to the same version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "v$ver"
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            gh release view $tag --repo dragonking587-ai/Auralith 2>$null
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "Waiting for $tag so Host Console can join the same release..."
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { throw "Release $tag does not exist yet. Main Auralith must publish first so both installers share one tag." }
          Get-ChildItem dist | Where-Object { $_.Name -ne 'latest-host-console.json' } | ForEach-Object {
            gh release upload $tag $_.FullName --repo dragonking587-ai/Auralith --clobber
          }
          $assets = gh api "repos/dragonking587-ai/Auralith/releases/tags/$tag" | ConvertFrom-Json
          $exe = $assets.assets | Where-Object { $_.name -match 'Auralith\.Host\.Console_.*x64-setup\.exe$' -and $_.name -notmatch '\.sig$' } | Select-Object -First 1
          if (-not $exe) { $exe = $assets.assets | Where-Object { $_.name -match 'Auralith-Host-Console-.*-x64-Setup\.exe$' } | Select-Object -First 1 }
          if (-not $exe) { throw "No Host Console setup exe on $tag" }
          $url = $exe.browser_download_url
          if ($url -match 'Auralith-Reborn|Auralith\.Reborn') { throw "Host Console manifest must not point at Main Auralith" }
          $code = (Invoke-WebRequest -Method Head -Uri $url -UseBasicParsing).StatusCode
          if ($code -ne 200) { throw "Host Console updater artifact 404: $url" }
          $sig = ""
          if (Test-Path dist/latest-host-console.json) {
            $old = Get-Content dist/latest-host-console.json -Raw | ConvertFrom-Json
            $sig = $old.platforms.'windows-x86_64'.signature
          }
          @{
            version = $ver
            notes = "Auralith Host Console $ver"
            pub_date = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig; url = $url } }
          } | ConvertTo-Json -Depth 6 | Set-Content dist/latest-host-console.json -Encoding utf8
          gh release upload $tag dist/latest-host-console.json --repo dragonking587-ai/Auralith --clobber
          gh release upload updater-latest dist/latest-host-console.json --repo dragonking587-ai/Auralith --clobber
          Write-Host "HOST CONSOLE UPDATER URL $url HTTP $code"
