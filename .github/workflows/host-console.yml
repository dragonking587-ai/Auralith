name: Build Auralith Host Console

on:
  workflow_dispatch:
  push:
    branches: [tauri/auralith-reborn]
    paths:
      - "apps/auralith-host-console/**"
      - ".github/workflows/host-console.yml"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/auralith-host-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: npm install --include=dev --registry https://registry.npmjs.org
      - name: Tauri NSIS
        run: npx tauri build --bundles nsis
      - name: Collect installer
        shell: pwsh
        run: |
          $src = Get-ChildItem -Recurse "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $src) { throw "No NSIS exe" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $name = "Auralith-Host-Console-1.0.0-rc.28-x64-Setup.exe"
          Copy-Item $src.FullName "dist/$name"
          Get-FileHash "dist/$name" -Algorithm SHA256 | Out-File "dist/SHA256.txt"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: Auralith-Host-Console-nsis
          path: apps/auralith-host-console/dist/*
      - name: Attach to v1.0.0-rc.28
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload v1.0.0-rc.28 "dist/Auralith-Host-Console-1.0.0-rc.28-x64-Setup.exe" --repo dragonking587-ai/Auralith --clobber
