name: Build Auralith Host Console

on:
  workflow_dispatch:
  push:
    branches: [tauri/auralith-reborn]
    paths:
      - "apps/auralith-host-console/**"
      - ".github/workflows/host-console.yml"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/auralith-host-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: npm install --include=dev --registry https://registry.npmjs.org
      - name: Tauri NSIS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis
      - name: Collect installer
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $src = Get-ChildItem -Recurse "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $src) { throw "No NSIS exe" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $friendly = "Auralith-Host-Console-$ver-x64-Setup.exe"
          Copy-Item $src.FullName "dist/$friendly"
          Copy-Item $src.FullName "dist/$($src.Name)"
          $sig = Get-ChildItem -Recurse src-tauri/target/release/bundle -Include *.sig | Select-Object -First 1
          $zip = Get-ChildItem -Recurse src-tauri/target/release/bundle -Include *.nsis.zip,*.zip | Where-Object { $_.Name -match "nsis|updater" } | Select-Object -First 1
          if ($sig) { Copy-Item $sig.FullName "dist/$($sig.Name)" }
          if ($zip) { Copy-Item $zip.FullName "dist/$($zip.Name)" }
          $sigText = if ($sig) { (Get-Content $sig.FullName -Raw).Trim() } else { "" }
          $signedName = if ($zip) { $zip.Name } else { $src.Name }
          $enc = [uri]::EscapeDataString($signedName)
          $url = "https://github.com/dragonking587-ai/Auralith/releases/download/v$ver/$enc"
          if ($url -match "Auralith-Reborn") { throw "Host Console manifest must not point at Reborn" }
          @{
            version = $ver
            notes = "Auralith Host Console $ver"
            pub_date = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigText
                url = $url
              }
            }
          } | ConvertTo-Json -Depth 6 | Set-Content dist/latest-host-console.json -Encoding utf8
          if (-not $sigText) { Write-Warning "No Host Console updater signature produced" }
          Get-FileHash "dist/$friendly" -Algorithm SHA256 | Out-File "dist/SHA256.txt"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: Auralith-Host-Console-nsis
          path: apps/auralith-host-console/dist/*
      - name: Publish Host Console assets LAST
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "v$ver"
          gh release view $tag --repo dragonking587-ai/Auralith
          Get-ChildItem dist | ForEach-Object {
            gh release upload $tag $_.FullName --repo dragonking587-ai/Auralith --clobber
          }
          gh release upload updater-latest dist/latest-host-console.json --repo dragonking587-ai/Auralith --clobber
