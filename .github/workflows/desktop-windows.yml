name: Auralith Desktop Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v2.0.0-alpha.2)"
        required: false
        default: "v2.0.0-alpha.2"
  push:
    tags:
      - "v*-desktop*"
      - "v2.*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop UI
        run: npm run desktop:build

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Auralith Virtual Camera (Softcam)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          New-Item -ItemType Directory -Force -Path "vendor\softcam\out" | Out-Null
          & $msbuild "vendor\softcam\src\softcam\softcam.vcxproj" /p:Configuration=Release /p:Platform=x64 /m
          if ($LASTEXITCODE -ne 0) { throw "Softcam MSBuild failed with $LASTEXITCODE" }
          $dll = Get-ChildItem -Path "vendor\softcam" -Recurse -Filter "softcam.dll" |
            Where-Object { $_.FullName -match "\\x64\\Release\\" -or $_.FullName -match "\\Release\\" } |
            Select-Object -First 1
          if (-not $dll) { throw "softcam.dll not produced" }
          Copy-Item $dll.FullName "vendor\softcam\out\softcam.dll" -Force
          Write-Host "Softcam DLL: $($dll.FullName) -> vendor\softcam\out\softcam.dll"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Skip nested beforeBuildCommand
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.build.beforeBuildCommand = ""
          $json | ConvertTo-Json -Depth 30 | Set-Content $path -Encoding utf8

      - name: Derive release metadata from tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="v2.0.0-alpha.2"
          fi
          # v1.0.0-desktop-test.17 -> "Auralith Desktop Test 17"
          NAME="$TAG"
          if [[ "$TAG" =~ desktop-test\.([0-9]+)$ ]]; then
            NAME="Auralith Desktop Test ${BASH_REMATCH[1]}"
          elif [[ "$TAG" =~ ^v(.+)$ ]]; then
            NAME="Auralith ${BASH_REMATCH[1]}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Derived release: $NAME ($TAG)"

      - name: Validate updater signing secrets (no values logged)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "INSTALLER CREATED later may still fail: TAURI_SIGNING_PRIVATE_KEY secret is empty"
            exit 1
          fi
          python3 - <<'PY'
          import os, base64
          k = os.environ.get("TAURI_SIGNING_PRIVATE_KEY", "").strip().strip('"').strip("'")
          print("signing_key_char_length", len(k))
          print("password_secret_set", bool(os.environ.get("TAURI_SIGNING_PRIVATE_KEY_PASSWORD")))
          try:
              raw = base64.b64decode(k, validate=False)
          except Exception as e:
              raise SystemExit(f"TAURI_SIGNING_PRIVATE_KEY is not valid base64: {e}")
          header = raw.split(b"\n", 1)[0]
          if not raw.startswith(b"untrusted comment:"):
              raise SystemExit("decoded key missing minisign 'untrusted comment' header")
          if b"public key" in header and b"secret" not in header:
              raise SystemExit("secret appears to be a PUBLIC key, not a private key")
          if b"secret key" not in header and b"encrypted secret" not in header:
              print("WARNING: decoded header does not mention secret key")
          print("updater private key header: OK")
          PY

      - name: Build Windows NSIS installer (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: ${{ steps.meta.outputs.name }}
          releaseBody: |
            ${{ steps.meta.outputs.name }} (`${{ steps.meta.outputs.tag }}`).

            ## Recommended output
            **Broadcast Output** — Window Capture → `Auralith — Broadcast Output`
            (OBS: prefer capture method Windows 10 / 1903+ when available.)

            ## Alternative
            Browser Source — `http://127.0.0.1:<port>/source/<session>`

            ## Experimental
            Virtual Camera — install/start only if needed; not required for Window Capture.

            Installer is **unsigned** (SmartScreen may warn).
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true

      - name: Verify NSIS installer exists
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "src-tauri\target\release\bundle\nsis\*.exe",
            "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe"
          )
          $found = @()
          foreach ($pat in $candidates) {
            $found += Get-Item $pat -ErrorAction SilentlyContinue
          }
          if (-not $found -or $found.Count -eq 0) {
            throw "P0 gate failed: no Auralith NSIS installer (*.exe) produced under src-tauri/target/**/bundle/nsis/"
          }
          $found | ForEach-Object { Write-Host "Installer: $($_.FullName) ($([math]::Round($_.Length/1MB,2)) MB)" }
          if (-not (Test-Path "vendor\softcam\out\softcam.dll")) {
            throw "P0 gate failed: softcam.dll missing from vendor/softcam/out (bundled resource required)"
          }
          Write-Host "softcam.dll present for bundle resources"
          $sig = @()
          $sig += Get-Item "src-tauri\target\release\bundle\nsis\*.sig" -ErrorAction SilentlyContinue
          $sig += Get-Item "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.sig" -ErrorAction SilentlyContinue
          $zip = @()
          $zip += Get-Item "src-tauri\target\release\bundle\nsis\*.nsis.zip" -ErrorAction SilentlyContinue
          $zip += Get-Item "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.nsis.zip" -ErrorAction SilentlyContinue
          if (-not $sig -or $sig.Count -eq 0) {
            throw "Updater gate failed: no minisign .sig produced (TAURI_SIGNING_PRIVATE_KEY missing or createUpdaterArtifacts failed)"
          }
          if (-not $zip -or $zip.Count -eq 0) {
            Write-Host "WARNING: no .nsis.zip updater artifact (installer exe still present)"
          }
          $sig | ForEach-Object { Write-Host "Updater signature: $($_.FullName)" }

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: auralith-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
            vendor/softcam/out/softcam.dll
          if-no-files-found: error
          retention-days: 14
