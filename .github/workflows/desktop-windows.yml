name: Auralith Desktop Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-desktop*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop UI
        run: npm run desktop:build

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Auralith Virtual Camera (Softcam)
        shell: cmd
        run: |
          cd vendor\softcam
          msbuild softcam.sln /t:BaseClasses;softcamcore;softcam /p:Configuration=Release /p:Platform=x64 /m
          if not exist out mkdir out
          if exist x64\Release\softcam.dll copy /Y x64\Release\softcam.dll out\softcam.dll
          if exist dist\bin\x64\softcam.dll copy /Y dist\bin\x64\softcam.dll out\softcam.dll
          if exist src\softcam\x64\Release\softcam.dll copy /Y src\softcam\x64\Release\softcam.dll out\softcam.dll
          if exist src\x64\Release\softcam.dll copy /Y src\x64\Release\softcam.dll out\softcam.dll
          dir /s /b softcam.dll
          dir out
          if not exist out\softcam.dll (echo softcam.dll missing & exit /b 1)
          echo Softcam x64 DLL ready for Tauri resources

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Skip nested beforeBuildCommand
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.build.beforeBuildCommand = ""
          $json | ConvertTo-Json -Depth 30 | Set-Content $path -Encoding utf8

      - name: Build Windows NSIS installer (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0-desktop-test.4' }}
          releaseName: Auralith Desktop Test 4
          releaseBody: |
            Auralith standalone Windows test build (`1.0.0-desktop-test.4`).

            ## Virtual Camera
            Device name: **Auralith Virtual Camera** (DirectShow Softcam user-mode filter).
            After install, run the included registration helper or: `regsvr32 softcam.dll` (admin once).
            OBS / Streamlabs / TikTok LIVE Studio: Video Capture Device → Auralith Virtual Camera.

            ## Outputs
            1. Virtual Camera (preferred)
            2. Window Capture — Auralith — Stream Output
            3. Browser Source — http://127.0.0.1:4317/source/<session>

            ## Updates
            In-app **Check for Updates** (Output → Updates). No GitHub credentials in the app.
            Private source repo cannot serve unauthenticated downloads — a public binary channel is recommended for full auto-update.

            This installer is **unsigned** (Windows code signing). SmartScreen may warn.
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: auralith-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            vendor/softcam/out/softcam.dll
          if-no-files-found: warn
          retention-days: 14
