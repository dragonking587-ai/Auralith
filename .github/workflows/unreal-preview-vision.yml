name: Unreal Preview Vision Payload

on:
  push:
    branches:
      - unreal-control
    paths:
      - 'unreal_bridge/previews/latest/**'
      - '.github/workflows/unreal-preview-vision.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-vision-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: unreal-control
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build compact vision payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, io, json, textwrap
          from PIL import Image, ImageStat

          root = Path('unreal_bridge/previews/latest')
          files = sorted([p for p in root.glob('*') if p.suffix.lower() in {'.png', '.jpg', '.jpeg'} and not p.name.startswith('vision_')])[:3]
          payload = {
              'format': 'auralith-preview-vision-v4',
              'source_count': len(files),
              'images': [],
          }

          for index, path in enumerate(files, start=1):
              with Image.open(path) as im:
                  rgb = im.convert('RGB')
                  original_size = {'width': rgb.width, 'height': rgb.height}

                  thumb = rgb.copy()
                  thumb.thumbnail((512, 288), Image.Resampling.LANCZOS)
                  stat = ImageStat.Stat(thumb)
                  mean = [round(v, 2) for v in stat.mean]
                  out = io.BytesIO()
                  thumb.save(out, format='JPEG', quality=76, optimize=True)
                  raw = out.getvalue()
                  thumb_name = f'vision_{index:02d}.jpg'
                  (root / thumb_name).write_bytes(raw)
                  encoded = base64.b64encode(raw).decode('ascii')
                  wrapped = '\n'.join(textwrap.wrap(encoded, 76)) + '\n'
                  (root / f'vision_{index:02d}.b64').write_text(wrapped, encoding='ascii')

                  coarse_w, coarse_h = 32, 18
                  coarse = rgb.resize((coarse_w, coarse_h), Image.Resampling.BILINEAR)
                  ppm_lines = ['P3', f'{coarse_w} {coarse_h}', '255']
                  pixels = list(coarse.getdata())
                  for y in range(coarse_h):
                      row = pixels[y * coarse_w:(y + 1) * coarse_w]
                      ppm_lines.append(' '.join(f'{r} {g} {b}' for r, g, b in row))
                  ppm_name = f'vision_{index:02d}.ppm.txt'
                  (root / ppm_name).write_text('\n'.join(ppm_lines) + '\n', encoding='ascii')

                  payload['images'].append({
                      'source_name': path.name,
                      'original_size': original_size,
                      'thumbnail_size': {'width': thumb.width, 'height': thumb.height},
                      'coarse_preview_size': {'width': coarse_w, 'height': coarse_h},
                      'mean_rgb': mean,
                      'jpeg_bytes': len(raw),
                      'thumbnail_file': thumb_name,
                      'base64_file': f'vision_{index:02d}.b64',
                      'ppm_text_file': ppm_name,
                  })

          for index in range(len(files) + 1, 4):
              for pattern in (f'vision_{index:02d}.jpg', f'vision_{index:02d}.b64', f'vision_{index:02d}.ppm.txt'):
                  stale = root / pattern
                  if stale.exists():
                      stale.unlink()

          out_path = root / 'vision_payload.json'
          out_path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(f'Wrote {out_path} with {len(payload["images"])} image(s)')
          PY

      - name: Upload preview thumbnails
        uses: actions/upload-artifact@v4
        with:
          name: auralith-preview-vision
          path: |
            unreal_bridge/previews/latest/vision_payload.json
            unreal_bridge/previews/latest/vision_*.jpg
          if-no-files-found: error
          retention-days: 7

      - name: Commit vision payload
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- unreal_bridge/previews/latest/vision_payload.json unreal_bridge/previews/latest/vision_*.b64 unreal_bridge/previews/latest/vision_*.ppm.txt)" ]; then
            echo "Vision payload unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add -A unreal_bridge/previews/latest/vision_payload.json unreal_bridge/previews/latest/vision_*.b64 unreal_bridge/previews/latest/vision_*.ppm.txt
          git commit -m "unreal(preview): publish compact vision payload"
          git push origin HEAD:unreal-control
