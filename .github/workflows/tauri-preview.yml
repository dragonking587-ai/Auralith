name: Auralith Reborn Preview
on:
  push:
    branches: [tauri/auralith-reborn]
    paths:
      - "apps/auralith-tauri/**"
      - ".github/workflows/tauri-preview.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this validated build and move updater-latest"
        required: false
        default: false
        type: boolean
jobs:
  windows:
    if: github.ref == 'refs/heads/tauri/auralith-reborn'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/auralith-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          if ($v -ne $pkg) { throw "VERSION ($v) != package.json ($pkg)" }
          if (-not $v) { throw "empty VERSION" }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "tag=v$v" >> $env:GITHUB_OUTPUT
          echo "file=Auralith-Reborn-$v-x64-Setup.exe" >> $env:GITHUB_OUTPUT
          echo "REBORN_VERSION=$v"
      - name: Install frontend
        run: npm install
      - name: Audit UI navigation and quality tiers
        run: |
          node scripts/verify-ui-navigation.mjs
          node scripts/verify-quality-system.mjs
      - name: Build frontend
        run: npm run build
      - name: Build virtual camera DLL
        working-directory: apps/auralith-tauri/vcam
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" && cl /nologo /LD /EHsc /O2 /DUNICODE /D_UNICODE auralith_reborn_vcam.cpp /link /DEF:auralith_reborn_vcam.def strmiids.lib ole32.lib oleaut32.lib uuid.lib kernel32.lib user32.lib advapi32.lib && dir"
      - name: Stage vcam DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          Copy-Item vcam/auralith_reborn_vcam.dll src-tauri/resources/ -Force
      - name: Tauri NSIS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis
      - name: Collect installer
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $name = "${{ steps.ver.outputs.file }}"
          $exe = Get-ChildItem -Recurse src-tauri/target/release/bundle -Filter *.exe | Where-Object { $_.Name -match "setup|nsis" } | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Recurse src-tauri/target -Filter *.exe | Where-Object { $_.Name -match "setup|nsis" } | Select-Object -First 1 }
          if (-not $exe) { throw "NSIS installer not found" }
          if ($exe.Length -le 0) { throw "empty installer" }
          New-Item -ItemType Directory -Force dist-install | Out-Null
          $dest = "dist-install/$name"
          Copy-Item $exe.FullName $dest
          Copy-Item $exe.FullName "dist-install/$($exe.Name)"
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
          "$name  $hash" | Set-Content dist-install/SHA256SUMS.txt
          Get-Item $dest | Format-List FullName,Length
          Write-Host "SHA256 $hash"
          $sig = Get-ChildItem -Recurse src-tauri/target/release/bundle -Include *.sig | Select-Object -First 1
          $zip = Get-ChildItem -Recurse src-tauri/target/release/bundle -Include *.nsis.zip,*.zip | Where-Object { $_.Name -match "nsis|updater" } | Select-Object -First 1
          if ($sig) { Copy-Item $sig.FullName "dist-install/$($sig.Name)" }
          if ($zip) { Copy-Item $zip.FullName "dist-install/$($zip.Name)" }
          $sigText = if ($sig) { (Get-Content $sig.FullName -Raw).Trim() } else { "" }
          $signedName = if ($zip) { $zip.Name } else { $exe.Name }
          $enc = [uri]::EscapeDataString($signedName)
          $url = "https://github.com/dragonking587-ai/Auralith/releases/download/v$v/$enc"
          $latest = [ordered]@{
            version = $v
            notes = "Auralith Reborn $v — cinematic render pipeline"
            pub_date = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigText
                url = $url
              }
            }
          }
          $latest | ConvertTo-Json -Depth 6 | Set-Content dist-install/latest.json -Encoding utf8
          if (-not $sigText) { Write-Warning "No updater signature produced" }
          Get-ChildItem dist-install | Format-Table Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: Auralith-Reborn-Preview-${{ steps.ver.outputs.version }}
          path: apps/auralith-tauri/dist-install/*
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Auralith Reborn ${{ steps.ver.outputs.version }} — Cinematic Render Pipeline
          target_commitish: tauri/auralith-reborn
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            apps/auralith-tauri/dist-install/*
          body: |
            # Auralith ${{ steps.ver.outputs.version }} — Cinematic Render Pipeline

            This release continues the rc.49 Reborn application with the existing UI and workflow preserved while upgrading rendering underneath it.

            ## New rendering pipeline
            - Three.js-managed cinematic compositor on the existing Reborn/Tauri shell
            - HDR-capable intermediate rendering and bloom
            - Audio-reactive chromatic aberration, film grain, vignette and output color processing
            - Dedicated GPU particle family for Sparks, Energy Sparks, Embers, Fireflies, Snow, Ash, Dust Motes and Bioluminescent Spores
            - Dedicated GPU volumetric family for Magic Energy, Plasma, Void Energy, Portal, Vortex, Smoke/Fog, Mist, Atmospheric Haze, Aurora, Cosmic Nebula, Frozen Breath and Spectral Aura
            - Existing trace/shape/prop SDF rendering retained for compatibility until those placement modes are migrated
            - Automatic fallback to the rc.49 renderer if the cinematic pipeline cannot initialize
            - Transparent capture path preserved for OBS-style overlays

            Public installer. No Beta Access Code is required.

            ## WINDOWS SMARTSCREEN NOTICE
            Windows may show "Windows protected your PC" because this build does not yet have an established Windows code-signing reputation.
            If downloaded from this official Auralith GitHub Release, use More info → Run anyway.
            Do not disable Windows SmartScreen or Windows Defender.

            Installer: ${{ steps.ver.outputs.file }}
            Branch: tauri/auralith-reborn
            Commit: ${{ github.sha }}
      - name: Rewrite latest.json from uploaded assets
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        working-directory: apps/auralith-tauri
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "v$v"
          $assets = gh api "repos/dragonking587-ai/Auralith/releases/tags/$tag" | ConvertFrom-Json
          $exe = $assets.assets | Where-Object { $_.name -match 'Auralith\.Reborn\.Preview_.*x64-setup\.exe$' -and $_.name -notmatch '\.sig$' } | Select-Object -First 1
          if (-not $exe) { $exe = $assets.assets | Where-Object { $_.name -match 'Auralith-Reborn-.*-x64-Setup\.exe$' } | Select-Object -First 1 }
          if (-not $exe) { throw "No Main Auralith setup exe on $tag" }
          $url = $exe.browser_download_url
          if ($url -match 'Host-Console|Host\.Console') { throw "Main manifest must not point at Host Console" }
          $code = (Invoke-WebRequest -Method Head -Uri $url -UseBasicParsing).StatusCode
          if ($code -ne 200) { throw "Updater artifact 404: $url" }
          $sig = ""
          if (Test-Path "dist-install/latest.json") {
            $old = Get-Content dist-install/latest.json -Raw | ConvertFrom-Json
            $sig = $old.platforms.'windows-x86_64'.signature
          }
          $latest = [ordered]@{
            version = $v
            notes = "Auralith Reborn $v — cinematic render pipeline"
            pub_date = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig; url = $url } }
          }
          $latest | ConvertTo-Json -Depth 6 | Set-Content dist-install/latest.json -Encoding utf8
          Write-Host "MAIN UPDATER URL $url HTTP $code"
          gh release upload $tag dist-install/latest.json --repo dragonking587-ai/Auralith --clobber
      - name: Publish updater-latest pointer
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: updater-latest
          name: Auralith Reborn updater metadata
          target_commitish: tauri/auralith-reborn
          prerelease: true
          files: |
            apps/auralith-tauri/dist-install/latest.json
          body: |
            Rolling updater metadata for Auralith Reborn.
            Points Check for Updates at the current signed Windows artifact.
          overwrite_files: true
