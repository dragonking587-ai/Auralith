name: Auralith Reborn Preview
on:
  push:
    branches: [tauri/auralith-reborn]
    paths:
      - "apps/auralith-tauri/**"
      - ".github/workflows/tauri-preview.yml"
  workflow_dispatch:
jobs:
  windows:
    if: github.ref == 'refs/heads/tauri/auralith-reborn'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/auralith-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Build virtual camera DLL
        working-directory: apps/auralith-tauri/vcam
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" && cl /nologo /LD /EHsc /O2 /DUNICODE /D_UNICODE auralith_reborn_vcam.cpp /link /DEF:auralith_reborn_vcam.def strmiids.lib ole32.lib oleaut32.lib uuid.lib kernel32.lib user32.lib advapi32.lib && dir"
      - name: Stage vcam DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          Copy-Item vcam/auralith_reborn_vcam.dll src-tauri/resources/ -Force
          Get-ChildItem src-tauri/resources
      - name: Tauri NSIS
        run: npx tauri build --bundles nsis
      - name: Collect installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse src-tauri/target -Filter *.exe | Where-Object { $_.Name -match "setup|nsis" } | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found" }
          New-Item -ItemType Directory -Force dist-install | Out-Null
          $dest = "dist-install/Auralith-Reborn-Preview-2.0.0-alpha.5-x64-Setup.exe"
          Copy-Item $exe.FullName $dest
          Get-FileHash $dest -Algorithm SHA256 | Out-File dist-install/SHA256SUMS.txt
          Get-Item $dest | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: Auralith-Reborn-Preview-2.0.0-alpha.5
          path: apps/auralith-tauri/dist-install/*
