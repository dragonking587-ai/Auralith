name: Auralith Native Core

on:
  workflow_dispatch:
  push:
    tags:
      - "Auralith-Native-*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.415"
      - name: Restore
        run: dotnet restore Auralith.sln
      - name: Build
        run: dotnet build Auralith.sln -c Release --no-restore -p:Platform=x64
      - name: Test
        run: dotnet test tests/Auralith.Core.Tests/Auralith.Core.Tests.csproj -c Release -p:Platform=x64
      - name: Publish app
        run: dotnet publish src/Auralith.App/Auralith.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsPackageType=None -o artifacts/Auralith
      - name: Publish updater helper
        run: |
          dotnet publish src/Auralith.Updater/Auralith.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/updater
          Copy-Item artifacts/updater/Auralith.Updater.exe artifacts/Auralith/Auralith.Updater.exe
      - name: Verify publish payload
        shell: pwsh
        run: |
          $exe = Get-Item artifacts/Auralith/Auralith.exe
          $upd = Get-Item artifacts/Auralith/Auralith.Updater.exe
          if (-not $exe -or -not $upd) { throw "Auralith.exe or Auralith.Updater.exe missing" }
          $pri = Get-ChildItem artifacts/Auralith -Filter *.pri -Recurse
          $boot = Test-Path artifacts/Auralith/Microsoft.WindowsAppRuntime.Bootstrap.dll
          Write-Host "EXE $($exe.Length) UPD $($upd.Length) PRI=$($pri.Count) Bootstrap=$boot"
          if (-not $boot) { throw "Windows App Runtime Bootstrap.dll missing" }
          if ($pri.Count -lt 3) { throw "Expected PRI packages" }
      - name: Smoke test published exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "artifacts/Auralith/Auralith.exe" -ArgumentList "--smoke-test" -PassThru -WorkingDirectory "artifacts/Auralith"
          $ok = $p.WaitForExit(45000)
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "Smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed exit $($p.ExitCode)" }
      - name: Package + checksum + manifest
        shell: pwsh
        run: |
          $ver = (Select-String -Path Directory.Build.props -Pattern '<AuralithVersion>(.+)</AuralithVersion>').Matches[0].Groups[1].Value
          $name = "Auralith-Native-$ver-win-x64.zip"
          Compress-Archive -Path artifacts/Auralith/* -DestinationPath "artifacts/$name" -Force
          $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "artifacts/$name.sha256" -Value "$hash  $name" -NoNewline
          $manifest = @{
            version = $ver
            channel = "preview"
            releaseUrl = "https://github.com/dragonking587-ai/Auralith/releases/tag/Auralith-Native-$ver"
            assetUrl = "https://github.com/dragonking587-ai/Auralith/releases/download/Auralith-Native-$ver/$name"
            assetName = $name
            sha256 = $hash
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
            releaseNotes = "Native Auralith $ver"
          } | ConvertTo-Json
          Set-Content -Path artifacts/update.json -Value $manifest
          echo "PKG=$name" >> $env:GITHUB_ENV
          echo "VER=$ver" >> $env:GITHUB_ENV
          Write-Host "packaged $name sha256=$hash"
      - uses: actions/upload-artifact@v4
        with:
          name: Auralith-Native-Windows
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/update.json
          if-no-files-found: error
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/Auralith-Native-')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: Auralith Native ${{ env.VER }}
          files: |
            artifacts/${{ env.PKG }}
            artifacts/${{ env.PKG }}.sha256
            artifacts/update.json
