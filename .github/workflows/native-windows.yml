name: Auralith Native Core

on:
  workflow_dispatch:
  push:
    tags:
      - "Auralith-Native-*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.415"
      - name: Restore
        run: dotnet restore Auralith.sln
      - name: Build
        run: dotnet build Auralith.sln -c Release --no-restore -p:Platform=x64
      - name: Test
        run: dotnet test tests/Auralith.Core.Tests/Auralith.Core.Tests.csproj -c Release -p:Platform=x64
      - name: Publish app
        run: dotnet publish src/Auralith.App/Auralith.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsPackageType=None -o artifacts/Auralith
      - name: Publish updater helper
        run: |
          dotnet publish src/Auralith.Updater/Auralith.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/updater
          Copy-Item artifacts/updater/Auralith.Updater.exe artifacts/Auralith/Auralith.Updater.exe
      - name: Verify publish payload
        shell: pwsh
        run: |
          $exe = Get-Item artifacts/Auralith/Auralith.exe
          $upd = Get-Item artifacts/Auralith/Auralith.Updater.exe
          if (-not $exe -or -not $upd) { throw "Auralith.exe or Auralith.Updater.exe missing" }
          $pri = Get-ChildItem artifacts/Auralith -Filter *.pri -Recurse
          if ($pri.Count -lt 3) { throw "Expected PRI packages" }
          if (-not (Test-Path artifacts/Auralith/Microsoft.WindowsAppRuntime.Bootstrap.dll)) { throw "Bootstrap missing" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path Directory.Build.props -Pattern '<AuralithVersion>(.+)</AuralithVersion>').Matches[0].Groups[1].Value
          $iss = Resolve-Path installer/Auralith.iss
          $pub = (Resolve-Path artifacts/Auralith).Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc $iss "/DMyAppVersion=$ver" "/DPublishDir=$pub"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed $LASTEXITCODE" }
          $setup = Get-Item "installer/Auralith-$ver-x64-Setup.exe"
          if ($setup.Length -lt 1000000) { throw "installer too small $($setup.Length)" }
          Copy-Item $setup.FullName "artifacts/$($setup.Name)"
          echo "VER=$ver" >> $env:GITHUB_ENV
          echo "SETUP=$($setup.Name)" >> $env:GITHUB_ENV
          Write-Host "installer $($setup.FullName) $($setup.Length)"
      - name: Silent install + installed smoke + uninstall
        shell: pwsh
        run: |
          $dir = Join-Path $env:TEMP "AuralithCiInstall"
          $log = Join-Path $env:TEMP "auralith-inno.log"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          $setup = (Get-Item artifacts/*-Setup.exe).FullName
          Write-Host "setup $setup"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES","/CURRENTUSER","/DIR=$dir","/LOG=$log" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log | Select-Object -Last 40 }
          if ($p.ExitCode -ne 0) { throw "silent install failed $($p.ExitCode)" }
          $exe = Join-Path $dir "Auralith.exe"
          if (-not (Test-Path $exe)) { throw "installed Auralith.exe missing" }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru -WorkingDirectory $dir
          $ok = $p.WaitForExit(45000)
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "installed smoke timed out" }
          if ($p.ExitCode -ne 0) { throw "installed smoke failed $($p.ExitCode)" }
          $unins = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          if (-not $unins) { throw "uninstaller missing" }
          & $unins.FullName /VERYSILENT /NORESTART /SUPPRESSMSGBOXES
          Write-Host "silent install, smoke, uninstall ok"
      - name: SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "artifacts/$env:SETUP" -Algorithm SHA256).Hash.ToLower()
          Set-Content "artifacts/$env:SETUP.sha256" "$hash  $env:SETUP"
          $manifest = @{
            version = $env:VER
            channel = "preview"
            releaseUrl = "https://github.com/dragonking587-ai/Auralith/releases/tag/Auralith-Native-$($env:VER)"
            assetUrl = "https://github.com/dragonking587-ai/Auralith/releases/download/Auralith-Native-$($env:VER)/$($env:SETUP)"
            assetName = $env:SETUP
            sha256 = $hash
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
            releaseNotes = "Auralith $env:VER installer"
          } | ConvertTo-Json
          Set-Content artifacts/update.json $manifest
          echo "SHA=$hash" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: Auralith-Native-Windows
          path: |
            artifacts/*-Setup.exe
            artifacts/*.sha256
            artifacts/update.json
          if-no-files-found: error
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/Auralith-Native-')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: Auralith Native — ${{ env.VER }} Installer
          body: |
            Pre-release / unsigned test installer.

            Native C# / WinUI 3 / D3D11 rebuild.
            Per-user install: %LOCALAPPDATA%\Programs\Auralith
            Image loading repair, Clean Capture, Check for Updates.

            Not included: Trace, Stamp, Emitter, WASAPI, effect library.
          files: |
            artifacts/${{ env.SETUP }}
            artifacts/${{ env.SETUP }}.sha256
            artifacts/update.json
