name: Publish Auralith Reborn RC49.3.10
# SONG_CARD_UI_LOCK_REPUBLISH

on:
  push:
    branches: [tauri/auralith-reborn]
    paths:
      - ".github/workflows/publish-rc49.3.10.yml"

permissions:
  actions: write
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri/auralith-reborn
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate RC49.3.10 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < apps/auralith-tauri/VERSION)" = "1.0.0-rc.49.3.10"
          cd apps/auralith-tauri
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/verify-ui-navigation.mjs
          node scripts/verify-quality-system.mjs
          node scripts/verify-effect-pack-system.mjs
          node scripts/verify-online-effect-pack-library.mjs
          node scripts/verify-rc49.3.10.mjs

      - name: Dispatch signed RC49.3.10 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run tauri-preview.yml \
            --repo dragonking587-ai/Auralith \
            --ref tauri/auralith-reborn \
            -f publish=true
          sleep 8
          run_id="$(gh run list --repo dragonking587-ai/Auralith --workflow tauri-preview.yml --branch tauri/auralith-reborn --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [[ -z "$run_id" ]]; then
            echo "Could not resolve dispatched release run"
            exit 1
          fi
          echo "Release workflow run: $run_id"
          gh run watch "$run_id" --repo dragonking587-ai/Auralith --exit-status

      - name: Finalize release notes and verify updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          v="1.0.0-rc.49.3.10"
          tag="v$v"
          gh release edit "$tag" --repo dragonking587-ai/Auralith \
            --title "Auralith Reborn $v — Neon Glow, Natural Flame & Song Card Fit" \
            --notes-file apps/auralith-tauri/RELEASE_NOTES.md
          gh release view "$tag" --repo dragonking587-ai/Auralith --json tagName,isDraft,isPrerelease,assets
          rm -rf /tmp/auralith-updater && mkdir -p /tmp/auralith-updater
          gh release download updater-latest --repo dragonking587-ai/Auralith --pattern latest.json --dir /tmp/auralith-updater --clobber
          node <<'NODE'
          const fs = require('fs');
          const latest = JSON.parse(fs.readFileSync('/tmp/auralith-updater/latest.json', 'utf8').replace(/^\uFEFF/, ''));
          if (latest.version !== '1.0.0-rc.49.3.10') throw new Error(`updater-latest points to ${latest.version}`);
          console.log('updater-latest verified ->', latest.version);
          NODE
