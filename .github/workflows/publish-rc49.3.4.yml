name: Publish Auralith Reborn RC49.3.4

on:
  push:
    branches: [tauri/auralith-reborn]
    paths:
      - "apps/auralith-tauri/VERSION"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri/auralith-reborn
      - name: Dispatch signed RC49.3.4 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < apps/auralith-tauri/VERSION)"
          if [[ "$version" != "1.0.0-rc.49.3.4" ]]; then
            echo "Not the one-shot RC49.3.4 target; no release dispatched."
            exit 0
          fi
          gh workflow run tauri-preview.yml \
            --repo dragonking587-ai/Auralith \
            --ref tauri/auralith-reborn \
            -f publish=true
          echo "Dispatched signed Auralith Reborn $version release."
