name: Deploy audience relay

on:
  workflow_dispatch:
  push:
    branches: [tauri/auralith-reborn]
    paths:
      - "services/audience-relay/**"
      - ".github/workflows/railway-relay.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/audience-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Missing GitHub Actions secret RAILWAY_TOKEN."
            exit 1
          fi
          echo "RAILWAY_TOKEN detected"
          railway status --json > /tmp/railway-status.json || railway status || true
          python3 - <<'PY'
          import json, os, sys
          wanted = (os.environ.get("RAILWAY_SERVICE") or "").strip()
          names = []
          try:
              data = json.load(open("/tmp/railway-status.json"))
          except Exception as e:
              print("status json parse:", e)
              data = {}
          print("status_type", type(data).__name__)
          def walk(obj):
              if isinstance(obj, dict):
                  n = obj.get("name") or obj.get("serviceName")
                  if n:
                      names.append(str(n))
                  for v in obj.values():
                      walk(v)
              elif isinstance(obj, list):
                  for v in obj:
                      walk(v)
          walk(data)
          seen=set(); uniq=[]
          for n in names:
              if n not in seen:
                  seen.add(n); uniq.append(n)
          print("discovered_services:", uniq)
          skip = {"postgres", "postgresql", "redis", "mysql", "mongo", "mongodb"}
          pick = wanted
          if not pick:
              for n in uniq:
                  if any(k in n.lower() for k in ("relay", "audience", "auralith")):
                      pick = n; break
          if not pick:
              for n in uniq:
                  if n.lower() not in skip:
                      pick = n; break
          if not pick and uniq:
              pick = uniq[0]
          if not pick:
              # last resort well-known names for this project
              pick = os.environ.get("RAILWAY_SERVICE") or "Obsidian"
          print("using_service:", pick)
          open("/tmp/service-name","w").write(pick)
          PY
          SERVICE=$(cat /tmp/service-name)
          echo "railway up --service $SERVICE"
          railway up --ci --detach --service "$SERVICE" || railway up --ci --detach --service Obsidian
