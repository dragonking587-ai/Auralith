name: Auralith rc.51 Update Bridge

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-update-bridge.yml"
      - "tools/Auralith.UpdateBridge.cs"

permissions:
  contents: write

jobs:
  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile updater bridge
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "64-bit .NET Framework compiler not found" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & $csc /nologo /target:winexe /platform:x64 /optimize+ "/out:artifacts\Auralith-2.0.0-rc.51-UpdateBridge.exe" "tools\Auralith.UpdateBridge.cs"
          if ($LASTEXITCODE -ne 0) { throw "Bridge compilation failed" }
          $path = "artifacts\Auralith-2.0.0-rc.51-UpdateBridge.exe"
          $bridge = Get-Item $path
          if ($bridge.Length -lt 4096 -or $bridge.Length -gt 5000000) { throw "Unexpected bridge size $($bridge.Length)" }
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "BRIDGE_SIZE=$($bridge.Length)"
          Write-Host "BRIDGE_SHA256=$hash"
      - name: Attach bridge to rc.51 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "Auralith-Native-2.0.0-rc.51"
          gh release view $tag --repo dragonking587-ai/Auralith *> $null
          if ($LASTEXITCODE -ne 0) { throw "rc.51 release was not available" }
          gh release upload $tag "artifacts\Auralith-2.0.0-rc.51-UpdateBridge.exe" --clobber --repo dragonking587-ai/Auralith
          if ($LASTEXITCODE -ne 0) { throw "Failed to attach update bridge" }
      - name: Retain transfer copy in source repository
        shell: pwsh
        run: |
          $dest = "tools\release-bridge\Auralith-2.0.0-rc.51-UpdateBridge.exe"
          New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
          Copy-Item "artifacts\Auralith-2.0.0-rc.51-UpdateBridge.exe" $dest -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $dest
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build: retain rc.51 updater bridge binary"
            git push origin HEAD:main
          }
