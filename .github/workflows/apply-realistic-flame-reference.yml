name: Apply Realistic Flame Reference Pass

on:
  push:
    branches:
      - fix/realistic-flame-reference
    paths:
      - .github/workflows/apply-realistic-flame-reference.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/realistic-flame-reference
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply realistic flame patch
        run: python apps/auralith-tauri/scripts/patch-realistic-flame.py
      - name: Verify frontend build
        working-directory: apps/auralith-tauri
        run: |
          npm install --include=dev --registry https://registry.npmjs.org
          npm run build
      - name: Commit patched fire implementation
        run: |
          git config user.name "dragonking587-ai"
          git config user.email "dragonking587@gmail.com"
          git rm .github/workflows/apply-realistic-flame-reference.yml
          git rm apps/auralith-tauri/scripts/patch-realistic-flame.py
          git add apps/auralith-tauri/src/render/renderer.ts apps/auralith-tauri/src/scene/types.ts
          git commit -m "effects: rebuild realistic flame as natural multi-source fire"
          git push origin HEAD:fix/realistic-flame-reference
